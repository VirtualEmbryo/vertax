[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vertax"
version = "0.4.0"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "AUTHORS"]
description = "Optimization of vertex models."
authors = [
  { name = "Turlier lab", email = "herve.turlier@cnrs.fr" },
]
maintainers = [
  { name = "Herve Turlier", email = "herve.turlier@cnrs.fr" },
]
# Contributors: Alessandro Pasqui, Matthieu Perez, Michael Corbeau, Jim Catacora Ocana,
# Anshuman Sinha, Hervé Turlier. Attribution is kept as a group here and in AUTHORS so that it does not
# have to be re-ranked; see https://www.turlierlab.com.
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cellpose==3.1.0",
  "importlib-resources>=6.5.2",
  "jax==0.4.34",
  "jaxlib==0.4.34",
  "jaxopt==0.8.3",
  "matplotlib==3.8.0",
  "numpy==1.26.4",
  "optax==0.2.4",
  "pandas>=2.3.3",
  "scikit-image==0.24.0",
  "scipy==1.17.1",
  "tifffile==2024.12.12",
]

classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
] # list of valid classifiers: https://pypi.org/classifiers/
#  At least put:
#  - which version(s) of Python your package works on,
#  - which operating systems your package will work on.
#  - which license your package is available under,

[project.urls]
# The public repository is VirtualEmbryo/vertax on GitHub; the documentation website is built from it
# and published on GitHub Pages.
Homepage = "https://github.com/VirtualEmbryo/vertax"
Documentation = "https://virtualembryo.github.io/vertax/"
"Bug Tracker" = "https://github.com/VirtualEmbryo/vertax/issues"
Changelog = "https://github.com/VirtualEmbryo/vertax/blob/main/CHANGELOG.md"
"Turlier lab" = "https://www.turlierlab.com"

[tool.ruff]
line-length = 120

# Exclude a variety of commonly ignored directories.
exclude = [
  ".bzr",
  ".direnv",
  ".eggs",
  ".git",
  ".git-rewrite",
  ".hg",
  ".mypy_cache",
  ".nox",
  ".pants.d",
  ".pytype",
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  "__pypackages__",
  "_build",
  "buck-out",
  "build",
  "dist",
  "node_modules",
  "venv",
  "*.pyi",
]

[tool.ruff.lint]
# Enable the pycodestyle (`E`) and Pyflakes (`F`) rules by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = [
  "E",
  "F",
  "W",
  "C90",
  "I",
  "N",
  "D",
  "UP",
  "ANN",
  "S",
  "B",
  "A",
  "COM",
  # "CPY",
  "C4",
  "EM",
  "EXE",
  "FA",
  "ISC",
  # "INP",
  "PT",
  "Q",
  "SIM",
  "ARG",
  "PTH",
  "NPY",
  "PERF",
  "RUF",
]
ignore = ["S101", "N816", "N803", "N806", "COM812", "S301", "E402"]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []


per-file-ignores = {}


[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
strict = true
warn_unreachable = true
ignore_missing_imports = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]


[tool.pytest.ini_options]
minversion = "6.0"
addopts = [
  "-ra",
  "--showlocals",
  "--strict-markers",
  "--strict-config",
  "--ignore=tests/other_tests",
  # Long-running tests are deselected by default; run them with `pytest -m long` (see README).
  "-m", "not long",
]
xfail_strict = true
filterwarnings = [
  "error",
  # matplotlib 3.8.0 drives pyparsing through its camelCase compatibility aliases when parsing
  # font specs at import time; pyparsing >= 3.3 deprecates those aliases (observed: `parseString`,
  # `resetCache`, and the list is matplotlib's, not ours). Measured with pyparsing 3.3.2 and
  # matplotlib 3.8.0. Under a bare "error" every matplotlib import becomes a COLLECTION failure --
  # 16 of 22 test modules -- so a fresh clone reports a red suite for a reason unrelated to
  # VertAX, which is the worst possible first impression of a released repository.
  #
  # This is scoped to one warning class from one third-party library, NOT a relaxation of the
  # "error" policy: every VertAX-raised warning is still fatal. Filtering by message was tried
  # first and is the wrong shape -- it turns into whack-a-mole over whichever aliases matplotlib
  # happens to call. DELETE THIS when matplotlib is upgraded past 3.8, and re-run the suite to
  # confirm it is no longer needed rather than leaving it as permanent debt.
  "ignore::pyparsing.warnings.PyparsingDeprecationWarning",
]
log_cli_level = "INFO"
testpaths = ["tests"]
markers = ["long: long-running or memory-hungry test, deselected by default (run with '-m long')"]

[dependency-groups]
dev = [
    "jupyterlab>=4.5.7",
    "pdoc>=16.0.0",
    "pytest>=8.4.2",
    "pytest-timeout",
    "scalene>=1.5.55",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.8.0",
    "mkdocstrings[python]>=1.0.8",
]
