<?xml version="1.0" encoding="UTF-8"?>
<!-- Schematic of a T1 transition inside a tissue and at the outline of a bounded mesh. Hand-written; colours as in
     scripts/make_doc_figures.py: edges #333333, cells #EEEBE3, vertices #C98500, the edge of the T1 transition #B8559A. -->
<svg xmlns="http://www.w3.org/2000/svg" width="780" height="470" viewBox="0 0 780 470" font-family="DejaVu Sans, Verdana, Helvetica, Arial, sans-serif" font-size="14.5" fill="#333333">
  <title>A T1 transition, inside the tissue and at the outline</title>
  <desc>Top row: four cells A, B, C, D; the edge shared by A and B shrinks to the threshold length min_dist_T1, then flips into a new edge, shared by C and D, slightly longer than the threshold. Bottom row: at the outline of a bounded mesh, the edge shared by the outline cells A and B shrinks and flips, and the inner cell C reaches the outline with a new arc.</desc>
  <defs>
    <marker id="step" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L10,5 L0,9 z" fill="#666666"/>
    </marker>
    <clipPath id="panel"><rect x="0" y="0" width="200" height="170"/></clipPath>
    <g id="inner-cells">
      <rect x="0" y="0" width="200" height="170" fill="#EEEBE3"/>
    </g>
  </defs>
  <rect width="780" height="470" fill="#ffffff"/>

  <text x="30" y="24" font-weight="bold">Inside the tissue</text>
  <text x="30" y="254" font-weight="bold">At the outline of a bounded mesh</text>

  <!-- Arrows between the panels. -->
  <g stroke="#666666" stroke-width="1.2" fill="none">
    <line x1="238" y1="120" x2="282" y2="120" marker-end="url(#step)"/>
    <line x1="498" y1="120" x2="542" y2="120" marker-end="url(#step)"/>
    <line x1="238" y1="350" x2="282" y2="350" marker-end="url(#step)"/>
    <line x1="498" y1="350" x2="542" y2="350" marker-end="url(#step)"/>
  </g>
  <g font-size="13.5" fill="#666666" text-anchor="middle">
    <text x="260" y="110">shrinks</text>
    <text x="520" y="110">flips</text>
    <text x="260" y="340">shrinks</text>
    <text x="520" y="340">flips</text>
  </g>

  <!-- Row 1, before. Outer ends at (40,15), (160,15), (40,155), (160,155). -->
  <g transform="translate(30,35)">
    <g clip-path="url(#panel)">
      <use href="#inner-cells"/>
      <g stroke="#333333" stroke-width="1.2" fill="none" stroke-linecap="round">
        <path d="M0,15 L40,15 L100,55 L160,15 L200,15 M40,15 L40,0 M160,15 L160,0"/>
        <path d="M0,155 L40,155 L100,115 L160,155 L200,155 M40,155 L40,170 M160,155 L160,170"/>
      </g>
      <line x1="100" y1="55" x2="100" y2="115" stroke="#B8559A" stroke-width="3"/>
      <g fill="#C98500"><circle cx="100" cy="55" r="4"/><circle cx="100" cy="115" r="4"/></g>
    </g>
    <rect x="0" y="0" width="200" height="170" fill="none" stroke="#999999" stroke-width="0.8"/>
    <g font-size="16" text-anchor="middle"><text x="45" y="90">A</text><text x="155" y="90">B</text><text x="100" y="32">C</text><text x="100" y="150">D</text></g>
    <text x="100" y="190" text-anchor="middle" font-size="13.5">before: A and B in contact</text>
  </g>

  <!-- Row 1, at the threshold. -->
  <g transform="translate(290,35)">
    <g clip-path="url(#panel)">
      <use href="#inner-cells"/>
      <g stroke="#333333" stroke-width="1.2" fill="none" stroke-linecap="round">
        <path d="M0,15 L40,15 L100,79 L160,15 L200,15 M40,15 L40,0 M160,15 L160,0"/>
        <path d="M0,155 L40,155 L100,91 L160,155 L200,155 M40,155 L40,170 M160,155 L160,170"/>
      </g>
      <line x1="100" y1="79" x2="100" y2="91" stroke="#B8559A" stroke-width="3"/>
      <g fill="#C98500"><circle cx="100" cy="79" r="3.5"/><circle cx="100" cy="91" r="3.5"/></g>
    </g>
    <rect x="0" y="0" width="200" height="170" fill="none" stroke="#999999" stroke-width="0.8"/>
    <g font-size="16" text-anchor="middle"><text x="45" y="90">A</text><text x="155" y="90">B</text><text x="100" y="32">C</text><text x="100" y="150">D</text></g>
    <text x="100" y="190" text-anchor="middle" font-size="13.5">length ≤ min_dist_T1</text>
  </g>

  <!-- Row 1, after the flip. -->
  <g transform="translate(550,35)">
    <g clip-path="url(#panel)">
      <use href="#inner-cells"/>
      <g stroke="#333333" stroke-width="1.2" fill="none" stroke-linecap="round">
        <path d="M0,15 L40,15 L93,85 L40,155 L0,155 M40,15 L40,0 M40,155 L40,170"/>
        <path d="M200,15 L160,15 L107,85 L160,155 L200,155 M160,15 L160,0 M160,155 L160,170"/>
      </g>
      <line x1="93" y1="85" x2="107" y2="85" stroke="#B8559A" stroke-width="3"/>
      <g fill="#C98500"><circle cx="93" cy="85" r="3.5"/><circle cx="107" cy="85" r="3.5"/></g>
    </g>
    <rect x="0" y="0" width="200" height="170" fill="none" stroke="#999999" stroke-width="0.8"/>
    <g font-size="16" text-anchor="middle"><text x="45" y="90">A</text><text x="155" y="90">B</text><text x="100" y="32">C</text><text x="100" y="150">D</text></g>
    <text x="100" y="190" text-anchor="middle" font-size="13.5">after: C and D in contact,</text>
    <text x="100" y="205" text-anchor="middle" font-size="13.5">new edge longer than min_dist_T1</text>
  </g>

  <!-- Row 2, before. The exterior is above the outline (white). -->
  <g transform="translate(30,265)">
    <g clip-path="url(#panel)">
      <rect x="0" y="0" width="200" height="170" fill="#ffffff"/>
      <path d="M-10,62 Q55,15 100,42 Q145,15 210,62 L210,170 L-10,170 Z" fill="#EEEBE3"/>
      <g stroke="#333333" stroke-width="1.2" fill="none" stroke-linecap="round">
        <path d="M-10,62 Q55,15 100,42 Q145,15 210,62"/>
        <path d="M50,170 L100,105 L150,170"/>
      </g>
      <line x1="100" y1="42" x2="100" y2="105" stroke="#B8559A" stroke-width="3"/>
      <g fill="#C98500"><circle cx="100" cy="42" r="4"/><circle cx="100" cy="105" r="4"/></g>
    </g>
    <rect x="0" y="0" width="200" height="170" fill="none" stroke="#999999" stroke-width="0.8"/>
    <text x="100" y="20" text-anchor="middle" font-size="13.5" font-style="italic" fill="#666666">exterior</text>
    <g font-size="16" text-anchor="middle"><text x="45" y="100">A</text><text x="155" y="100">B</text><text x="100" y="155">C</text></g>
    <text x="100" y="190" text-anchor="middle" font-size="13.5">before: C is inside</text>
  </g>

  <!-- Row 2, at the threshold. -->
  <g transform="translate(290,265)">
    <g clip-path="url(#panel)">
      <rect x="0" y="0" width="200" height="170" fill="#ffffff"/>
      <path d="M-10,62 Q60,40 100,73 Q140,40 210,62 L210,170 L-10,170 Z" fill="#EEEBE3"/>
      <g stroke="#333333" stroke-width="1.2" fill="none" stroke-linecap="round">
        <path d="M-10,62 Q60,40 100,73 Q140,40 210,62"/>
        <path d="M50,170 L100,85 L150,170"/>
      </g>
      <line x1="100" y1="73" x2="100" y2="85" stroke="#B8559A" stroke-width="3"/>
      <g fill="#C98500"><circle cx="100" cy="73" r="3.5"/><circle cx="100" cy="85" r="3.5"/></g>
    </g>
    <rect x="0" y="0" width="200" height="170" fill="none" stroke="#999999" stroke-width="0.8"/>
    <g font-size="16" text-anchor="middle"><text x="45" y="110">A</text><text x="155" y="110">B</text><text x="100" y="155">C</text></g>
    <text x="100" y="190" text-anchor="middle" font-size="13.5">length ≤ min_dist_T1</text>
  </g>

  <!-- Row 2, after the flip: C reaches the outline with a new arc. -->
  <g transform="translate(550,265)">
    <g clip-path="url(#panel)">
      <rect x="0" y="0" width="200" height="170" fill="#ffffff"/>
      <path d="M-10,62 Q58,42 93,79 Q100,72 107,79 Q142,42 210,62 L210,170 L-10,170 Z" fill="#EEEBE3"/>
      <g stroke="#333333" stroke-width="1.2" fill="none" stroke-linecap="round">
        <path d="M-10,62 Q58,42 93,79"/>
        <path d="M107,79 Q142,42 210,62"/>
        <path d="M50,170 L93,79 M150,170 L107,79"/>
      </g>
      <path d="M93,79 Q100,72 107,79" stroke="#B8559A" stroke-width="3" fill="none"/>
      <g fill="#C98500"><circle cx="93" cy="79" r="3.5"/><circle cx="107" cy="79" r="3.5"/></g>
    </g>
    <rect x="0" y="0" width="200" height="170" fill="none" stroke="#999999" stroke-width="0.8"/>
    <g font-size="16" text-anchor="middle"><text x="45" y="110">A</text><text x="155" y="110">B</text><text x="100" y="155">C</text></g>
    <text x="100" y="190" text-anchor="middle" font-size="13.5">after: C reaches the outline</text>
  </g>
</svg>
