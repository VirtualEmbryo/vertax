<?xml version="1.0" encoding="UTF-8"?>
<!-- Schematic of one epoch of the bilevel optimization and of the four gradient estimators. Hand-written; the
     estimator hues and markers are those of scripts/make_doc_figures.py: AD #3953a4 circle, Sen-ID #8753FF triangle,
     Adj-ID #ed2024 square, EP #0c8140 diamond. -->
<svg xmlns="http://www.w3.org/2000/svg" width="780" height="530" viewBox="0 0 780 530" font-family="DejaVu Sans, Verdana, Helvetica, Arial, sans-serif" font-size="16" fill="#333333" xmlns:c2pa="http://c2pa.org/manifest">
  <title>One epoch of the bilevel optimization, with the four gradient estimators</title>
  <desc>The parameters theta set the energy; the relaxation finds the equilibrium X*; the cost compares it with the target; one of four estimators (AD, Sen-ID, Adj-ID, EP) gives the gradient of the cost with respect to theta; the outer solver takes a step and the mean-value constraints are applied, which gives the parameters of the next epoch.</desc>
  <defs>
    <marker id="flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L10,5 L0,9 z" fill="#555555"/>
    </marker>
  </defs>
  <rect width="780" height="530" fill="#ffffff"/>

  <!-- Top row: parameters, relaxation, cost. -->
  <g stroke="#333333" stroke-width="1" fill="#EEEBE3">
    <rect x="24" y="20" width="200" height="118" rx="6"/>
    <rect x="268" y="20" width="270" height="118" rx="6"/>
    <rect x="582" y="20" width="176" height="118" rx="6"/>
  </g>
  <text x="124" y="50" text-anchor="middle" font-weight="bold">parameters θ</text>
  <g font-size="14.5" text-anchor="middle">
    <text x="124" y="78">vertices_params,</text>
    <text x="124" y="99">edges_params,</text>
    <text x="124" y="120">faces_params</text>
  </g>
  <text x="403" y="50" text-anchor="middle" font-weight="bold">relaxation (inner problem)</text>
  <text x="403" y="86" text-anchor="middle" font-style="italic">X*<tspan font-style="normal" font-size="12" dy="5">θ</tspan><tspan dy="-5" font-style="normal"> ∈ argmin</tspan><tspan font-style="normal" font-size="12" dy="5">X</tspan><tspan dy="-5"> E</tspan><tspan font-style="normal">(</tspan>X<tspan font-style="normal">, θ)</tspan></text>
  <text x="403" y="118" text-anchor="middle" font-size="14.5">with T1 transitions</text>
  <text x="670" y="50" text-anchor="middle" font-weight="bold">cost</text>
  <text x="670" y="86" text-anchor="middle" font-style="italic">C<tspan font-style="normal">(</tspan>X*<tspan font-style="normal" font-size="12" dy="5">θ</tspan><tspan dy="-5" font-style="normal">, target)</tspan></text>
  <g stroke="#555555" stroke-width="1.4" fill="none">
    <line x1="224" y1="79" x2="264" y2="79" marker-end="url(#flow)"/>
    <line x1="538" y1="79" x2="578" y2="79" marker-end="url(#flow)"/>
    <line x1="670" y1="138" x2="670" y2="190" marker-end="url(#flow)"/>
  </g>

  <!-- The four estimators, two by two. -->
  <text x="24" y="178" font-weight="bold">gradient ∇<tspan font-size="12" dy="5">θ</tspan><tspan dy="-5"> C, by one of four estimators</tspan></text>
  <g fill="#ffffff" stroke-width="1.8">
    <rect x="24" y="194" width="360" height="96" rx="6" stroke="#3953a4"/>
    <rect x="398" y="194" width="360" height="96" rx="6" stroke="#8753FF"/>
    <rect x="24" y="302" width="360" height="96" rx="6" stroke="#ed2024"/>
    <rect x="398" y="302" width="360" height="96" rx="6" stroke="#0c8140"/>
  </g>
  <!-- Markers: circle, triangle, square, diamond. -->
  <circle cx="45" cy="218" r="7" fill="#3953a4"/>
  <path d="M419,210 L427,225 L411,225 z" fill="#8753FF"/>
  <rect x="38" y="319" width="14" height="14" fill="#ed2024"/>
  <path d="M419,316 L428,326 L419,336 L410,326 z" fill="#0c8140"/>
  <g font-weight="bold">
    <text x="62" y="224" fill="#3953a4">AD</text>
    <text x="436" y="224" fill="#8753FF">Sen-ID</text>
    <text x="62" y="332" fill="#ed2024">Adj-ID</text>
    <text x="436" y="332" fill="#0c8140">EP</text>
  </g>
  <g font-size="14.5">
    <text x="40" y="252">differentiates through the iterations of</text>
    <text x="40" y="274">the relaxation, in reverse mode (jax.grad)</text>
    <text x="414" y="252">one linear solve per parameter, at the</text>
    <text x="414" y="276">equilibrium: <tspan font-style="italic">H s</tspan><tspan font-size="11" dy="4">j</tspan><tspan dy="-4"> = −∂</tspan><tspan font-size="11" dy="4">θj</tspan><tspan dy="-4"> ∇</tspan><tspan font-size="11" dy="4">X</tspan><tspan dy="-4" font-style="italic"> E</tspan></text>
    <text x="40" y="360">one linear solve, at the equilibrium:</text>
    <text x="40" y="384"><tspan font-style="italic">H λ</tspan> = ∇<tspan font-size="11" dy="4">X</tspan><tspan dy="-4" font-style="italic"> C</tspan></text>
    <text x="414" y="360">two relaxations of <tspan font-style="italic">E</tspan> ± β <tspan font-style="italic">C</tspan>, then the</text>
    <text x="414" y="384">difference of ∂<tspan font-size="11" dy="4">θ</tspan><tspan dy="-4" font-style="italic"> E</tspan> divided by 2β</text>
  </g>

  <!-- Outer step and back to the parameters. -->
  <g stroke="#333333" stroke-width="1" fill="#EEEBE3">
    <rect x="238" y="430" width="330" height="84" rx="6"/>
  </g>
  <text x="403" y="458" text-anchor="middle" font-weight="bold">outer step</text>
  <text x="403" y="482" text-anchor="middle" font-size="14.5">one step of outer_solver (Optax),</text>
  <text x="403" y="503" text-anchor="middle" font-size="14.5">then params_normalization</text>
  <g stroke="#555555" stroke-width="1.4" fill="none">
    <line x1="391" y1="398" x2="391" y2="426" marker-end="url(#flow)"/>
    <polyline points="238,472 10,472 10,79 20,79" marker-end="url(#flow)"/>
  </g>
  <text x="124" y="462" font-size="14.5" fill="#555555" text-anchor="middle">next epoch</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
