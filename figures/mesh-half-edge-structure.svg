<?xml version="1.0" encoding="UTF-8"?>
<!-- Schematic of the half-edge tables of a VertAX mesh. Hand-written; colours as in scripts/make_doc_figures.py:
     edges #333333, cells #EEEBE3 (highlighted face #D3CBB8), vertices #C98500, half-edges #2B8CC4. -->
<svg xmlns="http://www.w3.org/2000/svg" width="780" height="360" viewBox="0 0 780 360" font-family="DejaVu Sans, Verdana, Helvetica, Arial, sans-serif" font-size="14.5" fill="#333333" xmlns:c2pa="http://c2pa.org/manifest">
  <title>The half-edge structure of a mesh</title>
  <desc>A face f and its neighbour g share an edge made of a half-edge h, in face f, and its twin, in face g. h goes from its source vertex to its target vertex; next and previous are the half-edges before and after it around f. On the right, a half-edge that crosses the right side of the periodic box: its target vertex is stored at the left side of the box, and the x-offset +1 of the half-edge says that it is read one box width further.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L10,5 L0,9 z" fill="#2B8CC4"/>
    </marker>
    <marker id="arrow-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L10,5 L0,9 z" fill="#666666"/>
    </marker>
    <clipPath id="left-panel"><rect x="20" y="20" width="420" height="320"/></clipPath>
  </defs>
  <rect width="780" height="360" fill="#ffffff"/>

  <!-- Left: a patch of hexagonal cells (circumradius 60), face f centred at (200,190), g at (304,190). -->
  <g clip-path="url(#left-panel)" stroke="#333333" stroke-width="1.2" stroke-linejoin="round">
    <g fill="#EEEBE3">
      <polygon points="252,160 252,220 200,250 148,220 148,160 200,130" fill="#D3CBB8"/>
      <polygon points="356,160 356,220 304,250 252,220 252,160 304,130"/>
      <polygon points="148,160 148,220 96,250 44,220 44,160 96,130"/>
      <polygon points="200,70 200,130 148,160 96,130 96,70 148,40"/>
      <polygon points="304,70 304,130 252,160 200,130 200,70 252,40"/>
      <polygon points="408,70 408,130 356,160 304,130 304,70 356,40"/>
      <polygon points="200,250 200,310 148,340 96,310 96,250 148,220"/>
      <polygon points="304,250 304,310 252,340 200,310 200,250 252,220"/>
      <polygon points="408,250 408,310 356,340 304,310 304,250 356,220"/>
    </g>
  </g>
  <text x="200" y="196" text-anchor="middle" font-size="16" font-style="italic">f</text>
  <text x="318" y="196" text-anchor="middle" font-size="16" font-style="italic">g</text>

  <!-- Half-edge h in face f, counterclockwise around f (upwards on its right side), its twin in g. -->
  <line x1="243" y1="212" x2="243" y2="170" stroke="#2B8CC4" stroke-width="2.4" marker-end="url(#arrow)"/>
  <text x="228" y="196" text-anchor="end" fill="#2B8CC4" font-weight="bold">h</text>
  <line x1="261" y1="170" x2="261" y2="212" stroke="#2B8CC4" stroke-width="2.4" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <text x="267" y="207" fill="#2B8CC4">twin</text>
  <!-- next and previous of h, thinner. -->
  <line x1="240" y1="157" x2="210" y2="140" stroke="#2B8CC4" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="214" y="161" text-anchor="end" fill="#2B8CC4" font-size="13.5">next</text>
  <line x1="210" y1="240" x2="240" y2="223" stroke="#2B8CC4" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="234" y="215" text-anchor="end" fill="#2B8CC4" font-size="13.5">previous</text>

  <!-- Vertices: the source and the target of h. -->
  <circle cx="252" cy="220" r="4.5" fill="#C98500"/>
  <circle cx="252" cy="160" r="4.5" fill="#C98500"/>
  <g font-size="13.5" text-anchor="end">
    <text x="298" y="116">target of h</text>
    <text x="298" y="280">source of h</text>
  </g>
  <line x1="260" y1="121" x2="253" y2="154" stroke="#333333" stroke-width="0.8"/>
  <line x1="260" y1="267" x2="253" y2="226" stroke="#333333" stroke-width="0.8"/>

  <!-- Right: a half-edge crossing the right side of the periodic box. Box width W = 200 px here. -->
  <rect x="510" y="60" width="200" height="250" fill="#EEEBE3" stroke="none"/>
  <line x1="510" y1="50" x2="510" y2="320" stroke="#333333" stroke-width="1.2"/>
  <line x1="710" y1="50" x2="710" y2="320" stroke="#333333" stroke-width="1.2"/>
  <text x="510" y="338" text-anchor="middle" font-size="13.5">x = 0</text>
  <text x="710" y="338" text-anchor="middle" font-size="13.5">x = width</text>
  <line x1="514" y1="40" x2="706" y2="40" stroke="#666666" stroke-width="0.8" marker-start="url(#arrow-grey)" marker-end="url(#arrow-grey)"/>
  <text x="610" y="33" text-anchor="middle" font-size="13.5">width</text>

  <!-- The half-edge, drawn to the periodic image of its target. -->
  <line x1="660" y1="160" x2="742" y2="196" stroke="#333333" stroke-width="1.2"/>
  <line x1="664" y1="170" x2="734" y2="201" stroke="#2B8CC4" stroke-width="2.4" marker-end="url(#arrow)"/>
  <circle cx="660" cy="160" r="4.5" fill="#C98500"/>
  <text x="652" y="152" text-anchor="end" font-size="13.5">source</text>
  <circle cx="542" cy="196" r="4.5" fill="#C98500"/>
  <circle cx="742" cy="196" r="4.5" fill="#ffffff" stroke="#C98500" stroke-width="1.6"/>
  <line x1="548" y1="196" x2="736" y2="196" stroke="#666666" stroke-width="0.8" stroke-dasharray="2 3"/>
  <text x="548" y="222" font-size="13.5">stored target</text>
  <text x="742" y="178" font-size="13.5" text-anchor="middle">image</text>
  <text x="610" y="258" text-anchor="middle" font-size="12.5">offset (+1, 0) in columns 6, 7:</text>
  <text x="610" y="275" text-anchor="middle" font-size="12.5">the target is read</text>
  <text x="610" y="292" text-anchor="middle" font-size="12.5">one width to the right</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
